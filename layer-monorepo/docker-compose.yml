# =============================================================================
# LAYER Docker Compose Configuration
# =============================================================================
#
# NOTE: This file is provided for environments WITH Docker support.
#
# Cloud Native Strategy (Recommended for development):
# - PostgreSQL → Supabase (https://supabase.com)
# - Redis → Upstash (https://upstash.com)
#
# For local development WITHOUT Docker:
# - Use .env.example to configure external service URLs
# - Tests use pytest-mock and fakeredis for mocking
#
# =============================================================================

version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: layer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: layer
      POSTGRES_PASSWORD: layer_secret
      POSTGRES_DB: layer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layer -d layer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: layer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
